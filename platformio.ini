; PlatformIO Project Configuration File
;
; Two firmware targets share this one repo (see FSAE-LapTimer-Plan.md
; section 7): the gate nodes (src/gate) and the master node (src/master).
; They only share code via lib/LapTimerProtocol, so the wire format can never
; drift between the two. Each environment's build_src_filter compiles only
; its own src/ subfolder.
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = gate, master

[env]
framework = arduino
monitor_speed = 115200

; --- Gate node(s): ESP32-C3, one physical unit per gate --------------------
; Flash env:gate for gate 1 (start/finish). For additional gates, use
; `pio run -e gate-2 -t upload` etc. - each just overrides GATE_ID.
[env:gate]
platform = espressif32
board = esp32-c3-devkitc-02
build_src_filter = +<gate/>
build_flags = -D GATE_ID=1
lib_deps =
    nrf24/RF24@^1.4.9

[env:gate-2]
extends = env:gate
build_flags = -D GATE_ID=2

[env:gate-3]
extends = env:gate
build_flags = -D GATE_ID=3

[env:gate-4]
extends = env:gate
build_flags = -D GATE_ID=4

[env:gate-5]
extends = env:gate
build_flags = -D GATE_ID=5

; --- Master node: dual-core ESP32, hosts the WiFi AP + web dashboard -------
[env:master]
platform = espressif32
board = esp32dev
build_src_filter = +<master/>
board_build.filesystem = littlefs
lib_deps =
    nrf24/RF24@^1.4.9
    esp32async/ESPAsyncWebServer@^3.12.1
    bblanchon/ArduinoJson@^7.4.0
